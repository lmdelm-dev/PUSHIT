[package]
name = "echo_void_core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM simulation core for ECHO//VOID"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rand = { version = "0.9", features = ["small_rng"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
