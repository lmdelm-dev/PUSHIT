<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECHO//VOID — Music Survival Prototype</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <main id="game">
    <div class="hud">
      <div><span class="label">WORLD</span><strong id="worldName">CALM MEADOW</strong></div>
      <div><span class="label">WAVE</span><strong id="wave">1 / 3</strong></div>
      <div><span class="label">THREAT</span><strong id="threat">CALM</strong></div>
    </div>
    <canvas id="gpuWorld" aria-label="ECHO VOID WebGPU game canvas"></canvas>
    <canvas id="world" aria-label="ECHO VOID fallback game canvas"></canvas>
    <section class="bottom-panel">
      <div class="song-row">
        <div><span class="label">CURRENT SONG</span><strong id="songTitle">Your song</strong></div>
        <label class="upload">LOAD AUDIO <input id="audioInput" type="file" accept="audio/*" /></label>
      </div>
      <div class="meters">
        <div><span>INTENSITY</span><div class="bar"><i id="intensityBar"></i></div></div>
        <div><span>ECHO</span><div class="bar"><i id="echoBar"></i></div></div>
      </div>
      <p class="hint">WASD / Arrow Keys: move · Shift: sprint · Space: dodge · Survive until the song wave ends</p>
    </section>
  </main>
  <audio id="audio" crossorigin="anonymous"></audio>
  <script src="src/game.js"></script>
</body>
</html>
